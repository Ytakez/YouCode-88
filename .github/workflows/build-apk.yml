name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Cache opencode engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libopencode.so
          key: opencode-engine-${{ hashFiles('engine/build-engine.sh', 'engine/patches/android-bun.patch') }}

      - name: Build opencode engine (arm64, first run takes a while)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: sh engine/build-engine.sh

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouCode-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
